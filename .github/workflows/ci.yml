name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }

      - name: JVM
        run: clojure -M:test

      - run: npm install -g nbb
      # Not a duplicate. Avro writes both int and long as zigzag varints, and
      # a magnitude past 2^53 is refused rather than rounded -- a claim only a
      # runtime whose numbers are doubles can check.
      - name: ClojureScript (nbb, interpreted)
        run: nbb --classpath "src:test:$(clojure -Spath)" test/run.cljs
      - name: ClojureScript (cljs.main, compiled)
        run: clojure -M:cljs -m cljs.main --target node -m avro.cljs-runner

      - name: lint
        run: clojure -M:lint

      # The fixtures must stay byte-identical to what the reference writer
      # produces, or the suite is testing this repo against its own past
      # misunderstanding rather than against Avro -- which matters more here
      # than for a columnar format, because Avro writes NO TYPE TAGS and a
      # decoder that is wrong about the schema produces plausible values.
      #
      # deflate.avro is excluded for the reason org-apache-parquet excludes
      # gzip.parquet: deflate output is implementation-dependent, so
      # byte-equality across environments is not a property it has.
      - name: fixtures still match the reference writer
        run: |
          python3 -m venv /tmp/av && /tmp/av/bin/pip install --quiet fastavro cramjam
          /tmp/av/bin/python test/fixtures/generate.py
          git diff --exit-code -- test/fixtures ':!test/fixtures/deflate.avro'
